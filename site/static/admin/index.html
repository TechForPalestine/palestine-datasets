<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Tech For Palestine — Data Entry</title>
  </head>
  <body>
    <!-- Decap's number widget always renders <input type="number">, which lets
         the mouse scroll wheel increment/decrement the value when the field is
         focused — easy to trigger by accident right after typing a figure.
         There's no widget config to disable this, so block it globally: eat
         the wheel event while any number input has focus (it still scrolls
         the page normally otherwise). -->
    <script>
      document.addEventListener(
        'wheel',
        function (e) {
          var el = document.activeElement;
          if (el && el.tagName === 'INPUT' && el.type === 'number') {
            e.preventDefault();
          }
        },
        { passive: false },
      );
    </script>
    <!-- Decap CMS: git-based, commits straight to the repo (no backend/database).
         Bundle is self-hosted from our own deploy (not a third-party CDN). The
         version is pinned via the `decap-cms` devDependency and vendored into
         this folder at build time by `bun run vendor-decap`. -->
    <script src="/admin/decap-cms.js"></script>
  </body>
</html>
